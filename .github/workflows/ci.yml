name: Quiz CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Package site ZIP
        run: cd dist && zip -r ../kaoyan-quiz-site.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: kaoyan-quiz-site
          path: kaoyan-quiz-site.zip
