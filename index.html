<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14213b">
  <title>考研每日 Quiz</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<header><div class="wrap"><p class="eyebrow">KAOYAN QUIZ PLATFORM 2.0</p><h1>考研每日训练</h1><p>多科目题库 · 图片批量识别 · 自动判分 · 错题归档</p></div></header>
<main class="wrap">
  <section class="panel upload-panel">
    <div class="section-heading"><div><p class="eyebrow dark">IMAGE INTAKE</p><h2>试卷图片识别中心</h2><p class="muted">批量上传 JPG、PNG、WebP；最多20张，每张不超过8MB。</p></div><span class="pill">Workers AI</span></div>
    <label class="field-label" for="ocr-code">识别访问口令</label>
    <input id="ocr-code" type="password" autocomplete="off" placeholder="输入你在 Cloudflare 设置的 OCR_ACCESS_CODE">
    <label class="field-label" for="image-files">选择试卷图片</label>
    <input id="image-files" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="upload-actions"><button id="recognize-btn" class="primary">开始批量识别</button><button id="clear-ocr" class="secondary">清空结果</button><button id="export-ocr" class="secondary" disabled>导出识别文本</button></div>
    <div class="progress"><i id="ocr-progress"></i></div>
    <p id="ocr-status" class="muted" aria-live="polite">等待上传图片。重复上传过的图片会优先读取本机缓存。</p>
    <div id="ocr-results"></div>
  </section>
  <section class="toolbar">
    <label for="bank">选择题库</label><select id="bank" aria-label="选择题库"><option>正在加载题库…</option></select>
    <button id="export" class="secondary">导出答题记录</button><button id="reset" class="secondary">重置本套进度</button>
  </section>
  <section class="stats">
    <article><strong id="done">0/0</strong><span>已作答</span></article>
    <article><strong id="acc">—</strong><span>正确率</span></article>
    <article><strong id="unc">0</strong><span>模糊 / 不会</span></article>
    <article><strong id="fav">0</strong><span>收藏</span></article>
  </section>
  <div class="progress" aria-label="答题进度"><i id="progress"></i></div>
  <nav class="filters" aria-label="题目筛选">
    <button data-filter="all" class="active">全部</button><button data-filter="wrong">错题</button><button data-filter="uncertain">模糊/不会</button><button data-filter="fav">收藏</button>
  </nav>
  <p id="meta" class="muted" aria-live="polite"></p><div id="error" role="alert"></div>
  <section id="questions" aria-live="polite"></section>
</main>
<footer><div class="wrap">答题进度保存在当前浏览器。图片识别结果可导出备份；原始图片不会被网站长期保存。</div></footer>
<script src="./assets/app.js"></script>
</body></html>
